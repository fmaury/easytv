# Configuration d'EasyTV, prévue pour une Raspberry Pi.
# install.sh la copie en config.toml (sans jamais écraser une config existante).
# Sur un PC de développement : input = "keyboard" et mpv_args = [].

# Dossier contenant un sous-dossier par chaîne.
# Préfixer les dossiers par "01 - ", "02 - "… pour fixer l'ordre des chaînes.
channels_dir = "/media/tv"

# Comment on zappe :
#   "keyboard" : au clavier, dans la fenêtre mpv (développement sur PC)
#   "remote"   : par la page web sur téléphone, voir web_port (sur la Pi)
input = "remote"

# Fichier où EasyTV mémorise la dernière chaîne et la position de chaque chaîne.
state_file = "/var/lib/easytv/state.json"

# Délai (en secondes) pendant lequel une chaîne reprend à la position exacte.
# Au-delà, elle reprend la même vidéo depuis le début.
resume_timeout = 3600  # 1 h

# Port de la page web de télécommande : sur un téléphone du même Wi-Fi, ouvrir
# http://easytv.local (ou http://<adresse-ip-de-la-pi>). 0 la désactive.
# 80 est autorisé par le service systemd (CAP_NET_BIND_SERVICE). Sur un PC : 8080.
web_port = 80

# Heure du coucher : chaque jour à cette heure, la TV s'éteint toute seule et affiche
# « Il est temps de dormir ». On peut la rallumer ensuite depuis le téléphone.
# "" pour désactiver.
bedtime = "00:00"

# Fréquence de sauvegarde de l'état (en secondes). 30 s ménage la carte SD ; l'état est de toute
# façon sauvegardé immédiatement à chaque zapping et à l'arrêt.
save_interval = 30

# Fréquence de détection des vidéos et chaînes ajoutées ou supprimées (en secondes).
rescan_interval = 30

# Extensions reconnues comme vidéos (optionnel).
# video_extensions = [".mp4", ".mkv", ".avi", ".mov", ".m4v", ".webm", ".ts"]

# Options passées à mpv, propres à la machine.
mpv_args = [
    "--gpu-context=drm",                             # affichage direct sur la TV, sans bureau
    "--hwdec=v4l2m2m-copy",                          # décodage H.264 matériel de la Pi
                                                     # (sans « -copy » : écran noir sur Pi 3)
    "--ao=alsa",                                     # son sans PipeWire (service système)
    "--audio-device=alsa/hdmi:CARD=vc4hdmi,DEV=0",   # son par le HDMI de la TV
]
