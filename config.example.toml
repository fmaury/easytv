# Configuration d'EasyTV.
# Copier ce fichier en config.toml et l'adapter.

# Dossier contenant un sous-dossier par chaîne.
# Préfixer les dossiers par "01 - ", "02 - "… pour fixer l'ordre des chaînes.
channels_dir = "/media/tv"

# Fichier où EasyTV mémorise la dernière chaîne et la position de chaque chaîne.
state_file = "/var/lib/easytv/state.json"

# Délai (en secondes) pendant lequel une chaîne reprend à la position exacte.
# Au-delà, elle reprend la même vidéo depuis le début.
resume_timeout = 3600  # 1 h

# Fréquence de sauvegarde de l'état (en secondes).
save_interval = 5

# Fréquence de détection des vidéos et chaînes ajoutées ou supprimées (en secondes).
rescan_interval = 30

# Extensions reconnues comme vidéos (optionnel).
# video_extensions = [".mp4", ".mkv", ".avi", ".mov", ".m4v", ".webm", ".ts"]
