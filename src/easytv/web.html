<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EasyTV">
<title>EasyTV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111214'/%3E%3Crect x='16' y='26' width='68' height='46' rx='8' fill='none' stroke='%23ffd700' stroke-width='7'/%3E%3Cpath d='M38 84h24' stroke='%23ffd700' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark; /* dark scrollbars and controls */
    --bg: #111214;
    --panel: #1c1d21;
    --button: #26282d;
    --button-active: #34373e;
    --text: #f2f2f3;
    --muted: #9a9ca3;
    --accent: #ffd700;
    --accent-text: #111214;
    --danger: #ff6b5e;
    --line: #2c2e34;
    --sleep: #e07f7f;
    --wake: #6ec58a;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    max-width: 520px;
    margin: 0 auto;
    /* Fill the screen: the sound/channel buttons take the height left (see .remote.main). */
    min-height: 100vh;
    min-height: 100dvh; /* follows the mobile address bar */
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  button {
    font: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
  }

  .now {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel);
    border-radius: var(--radius);
    padding: 16px 18px;
    min-height: 92px;
  }
  .now .number {
    font-size: 48px;
    font-weight: 800;
    color: var(--accent);
    min-width: 1.2em;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .now .name { font-size: 22px; font-weight: 700; }
  .now .video { color: var(--muted); margin-top: 2px; }
  .now .text { min-width: 0; flex: 1; }
  .progress { margin-top: 10px; position: relative; }
  .progress .bar {
    height: 6px;
    border-radius: 3px;
    background: var(--button-active);
    overflow: hidden;
  }
  .progress .bar > div { height: 100%; width: 0; background: var(--accent); }
  .progress .times {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  /* TV off or channel unavailable: a message in place of the bar, at the same height. */
  .progress .message {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress .message[hidden] { display: none; }
  .progress .message.warning { color: var(--danger); }
  .now .name, .now .video { overflow-wrap: anywhere; }

  .offline {
    margin: 12px 0 0;
    padding: 10px 14px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--danger) 18%, transparent);
    color: var(--danger);
  }

  /* Like a TV remote: sound on the left, channels on the right, + above −. */
  .remote {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .remote button {
    background: var(--button);
    border-radius: var(--radius);
    min-height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-weight: 600;
    transition: transform 80ms ease, background 80ms ease;
  }
  .remote button .icon { font-size: 30px; line-height: 1; }
  .remote button.small { min-height: 72px; }
  .remote button.small .icon { font-size: 24px; }
  .remote button:active { transform: scale(0.96); background: var(--button-active); }
  .remote button.zap, .remote button.play { background: var(--accent); color: var(--accent-text); }
  .remote button.zap:active, .remote button.play:active {
    background: color-mix(in srgb, var(--accent) 80%, white);
  }
  /* Sections apart: a thin line and more space; sound and channels columns further apart. */
  .remote.main {
    column-gap: 24px;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    /* Rows grow with the screen, never below the buttons' minimum heights (short screens and
       landscape scroll instead), never giant on tablets. */
    flex: 1;
    max-height: 720px;
    grid-template-rows: auto minmax(84px, 1.2fr) minmax(72px, 1fr) minmax(84px, 1.2fr);
  }
  .remote .title {
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-align: center;
  }
  .remote button.sign { min-height: 84px; font-size: 48px; font-weight: 700; line-height: 1; }
  .remote button.sign.zap { font-size: 38px; }
  .remote button.emoji { font-size: 38px; line-height: 1; }
  /* The "off" button: a soft pastel red; it turns yellow ("on") once the TV sleeps. */
  .remote button#power { background: var(--sleep); }
  .remote button#power:active { background: color-mix(in srgb, var(--sleep) 80%, white); }
  .remote button#power.play { background: var(--wake); }
  .remote button#power.play:active { background: color-mix(in srgb, var(--wake) 80%, white); }
  .letter-i {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border: 3px solid currentColor;
    border-radius: 50%;
    font: 700 26px/1 Georgia, "Times New Roman", serif;
  }
  .remote .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .remote .split .caption { font-size: 13px; }
  .remote .level { font-size: 13px; font-weight: 500; color: var(--muted); }
  .remote button.muted { outline: 2px solid var(--danger); }
  .remote button.muted .level { color: var(--danger); }
  .gauge {
    width: 70%;
    height: 5px;
    border-radius: 3px;
    background: var(--button-active);
    overflow: hidden;
    margin-top: 2px;
  }
  .gauge > div { height: 100%; width: 0; background: var(--accent); transition: width 150ms ease; }

  .remote.top { grid-template-columns: 1fr 1fr 1fr; }
  .remote button.list-icon { font-size: 34px; line-height: 1; }

  /* Channel list: a sheet over the page, scrollable, closed by ✕, a tap outside or Esc. */
  dialog {
    width: min(520px, calc(100% - 24px));
    max-height: 82vh;
    margin: auto;
    padding: 0;
    border: 0;
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
  }
  dialog::backdrop { background: rgb(0 0 0 / 65%); }
  .sheet { display: flex; flex-direction: column; max-height: 82vh; }
  .sheet header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 14px 10px 20px;
    border-bottom: 1px solid var(--line);
  }
  .sheet header button {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--button);
    font-size: 20px;
  }
  .sheet .channels {
    overflow-y: auto;
    padding: 12px;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--button-active) transparent;
  }
  h2 {
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0;
  }
  .channels { display: flex; flex-direction: column; gap: 8px; }
  .channels button {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border-radius: 14px;
    padding: 14px 16px;
    min-height: 56px;
    transition: background 80ms ease;
  }
  .channels button:active { background: var(--button-active); }
  .channels .number {
    font-weight: 800;
    color: var(--accent);
    min-width: 1.6em;
    font-variant-numeric: tabular-nums;
  }
  .channels .label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .channels button.current { outline: 2px solid var(--accent); }
  .channels .live {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-text);
    background: var(--accent);
    border-radius: 999px;
    padding: 2px 9px;
  }
  .empty { color: var(--muted); padding: 4px; }
</style>
</head>
<body>
  <section class="now" aria-live="polite">
    <div class="number" id="number">–</div>
    <div class="text">
      <div class="name" id="name">Connexion…</div>
      <div class="video" id="video"></div>
      <div class="progress" id="progress" hidden>
        <div id="meter">
          <div class="bar"><div id="bar"></div></div>
          <div class="times"><span id="elapsed"></span><span id="total"></span></div>
        </div>
        <div class="message" id="progress-message" hidden></div>
      </div>
    </div>
  </section>
  <p class="offline" id="offline" hidden>La TV ne répond pas. Le téléphone est-il sur le Wi-Fi de la maison ?</p>

  <section class="remote top">
    <button class="small" data-action="info" aria-label="Infos sur la TV"><span class="letter-i">i</span></button>
    <button class="small list-icon" id="open-channels" aria-label="Liste des chaînes">☰</button>
    <button class="small emoji" data-action="stop" id="power" aria-label="Éteindre">😴</button>
  </section>

  <section class="remote main">
    <div class="title">Son</div>
    <div class="title">Chaîne</div>

    <button class="sign" data-action="volume_up" aria-label="Monter le son">+</button>
    <button class="sign zap" data-action="next_channel" aria-label="Chaîne suivante">▲</button>

    <button class="small" data-action="mute" id="mute" aria-label="Couper ou remettre le son">
      <span><span id="mute-icon">🔇</span> <span id="mute-label">Couper</span></span>
      <span class="level" id="level">–</span>
      <span class="gauge"><div id="gauge"></div></span>
    </button>
    <div class="split" aria-label="Vidéos">
      <button class="small" data-action="prev_video" aria-label="Vidéo précédente">
        <span class="icon">⏮</span><span class="caption">Précédente</span>
      </button>
      <button class="small" data-action="next_video" aria-label="Vidéo suivante">
        <span class="icon">⏭</span><span class="caption">Suivante</span>
      </button>
    </div>

    <button class="sign" data-action="volume_down" aria-label="Baisser le son">−</button>
    <button class="sign zap" data-action="prev_channel" aria-label="Chaîne précédente">▼</button>
  </section>

  <dialog id="channel-dialog" aria-labelledby="channel-title">
    <div class="sheet">
      <header>
        <h2 id="channel-title">Chaînes</h2>
        <button id="close-channels" aria-label="Fermer">✕</button>
      </header>
      <div class="channels" id="channels"></div>
    </div>
  </dialog>

<script>
  const $ = (id) => document.getElementById(id);
  let shown = null;

  // Progress of the current video: known at each poll, moved forward every second in between.
  // "loading": a placeholder while a video starts, so the panel does not jump; "idle": TV off or
  // channel unavailable, a message takes the bar's place; null: no channel at all.
  let progress = null;

  function clock(seconds) {
    const s = Math.floor(seconds);
    const h = Math.floor(s / 3600);
    const mm = String(Math.floor(s / 60) % 60).padStart(h ? 2 : 1, "0");
    const ss = String(s % 60).padStart(2, "0");
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }

  function showProgress() {
    const box = $("progress");
    box.hidden = progress === null;
    $("meter").style.visibility = progress === "idle" ? "hidden" : "visible";
    $("progress-message").hidden = progress !== "idle";
    if (progress === null) return;
    // Placeholder times even when hidden: an empty line would make the panel shrink.
    if (progress === "loading" || progress === "idle") {
      $("bar").style.width = "0%";
      $("elapsed").textContent = "–:––";
      $("total").textContent = "–:––";
      return;
    }
    const elapsed = (Date.now() - progress.at) / 1000;
    const position = Math.min(progress.position + elapsed, progress.duration);
    box.hidden = false;
    $("bar").style.width = `${(100 * position) / progress.duration}%`;
    $("elapsed").textContent = clock(position);
    $("total").textContent = clock(progress.duration);
  }

  function render(status) {
    if (status.current === null) {
      progress = null;
    } else if (status.stopped || status.unavailable) {
      progress = "idle";
    } else if (status.position !== null && status.duration) {
      progress = { position: status.position, duration: status.duration, at: Date.now() };
    } else {
      progress = "loading";
    }
    showProgress();
    const key = JSON.stringify({ ...status, position: null });
    if (key === shown) return;
    shown = key;

    const video = $("video");
    if (status.current === null) {
      $("number").textContent = "–";
      $("name").textContent = "Aucune chaîne";
      video.textContent = "";
    } else {
      $("number").textContent = status.current;
      $("name").textContent = status.channels[status.current - 1];
      // The episode stays shown when the TV is off: the panel keeps its height.
      video.textContent = status.video;
    }
    const message = $("progress-message");
    message.textContent = status.stopped ? `${status.sleep_text} 😴` : "Chaîne indisponible";
    message.classList.toggle("warning", status.unavailable && !status.stopped);

    const power = $("power");
    power.dataset.action = status.stopped ? "play" : "stop";
    power.classList.toggle("play", status.stopped);
    power.textContent = status.stopped ? "📺" : "😴";
    power.setAttribute("aria-label", status.stopped ? "Allumer" : "Éteindre");

    $("mute").classList.toggle("muted", status.muted);
    $("mute-icon").textContent = status.muted ? "🔈" : "🔇";
    $("mute-label").textContent = status.muted ? "Remettre" : "Couper";
    $("level").textContent = status.muted ? "Son coupé" : `Volume ${status.volume}`;
    $("gauge").style.width = status.muted ? "0%" : `${status.volume}%`;

    const list = $("channels");
    if (status.channels.length === 0) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "Aucune chaîne : ajoute des dossiers de vidéos sur la Pi.";
      list.replaceChildren(empty);
      return;
    }
    list.replaceChildren(...status.channels.map((name, i) => {
      const number = i + 1;
      const button = document.createElement("button");
      const current = number === status.current;
      button.className = current ? "current" : "";
      const num = document.createElement("span");
      num.className = "number";
      num.textContent = number;
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = name;
      button.append(num, label);
      if (current) {
        const live = document.createElement("span");
        live.className = "live";
        live.textContent = "En cours";
        button.append(live);
      }
      button.addEventListener("click", () => {
        send({ action: "goto", number });
        $("channel-dialog").close();
      });
      return button;
    }));
  }

  let failures = 0;
  function setOnline(online) {
    // Wi-Fi drops a request now and then: only warn when it keeps failing.
    failures = online ? 0 : failures + 1;
    $("offline").hidden = failures < 2;
  }

  async function refresh() {
    try {
      const response = await fetch("/api/status", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      render(await response.json());
      setOnline(true);
    } catch (error) {
      setOnline(false);
    }
  }

  async function send(command) {
    if (navigator.vibrate) navigator.vibrate(15);
    try {
      const response = await fetch("/api/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(command),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      setOnline(true);
    } catch (error) {
      setOnline(false);
    }
    // The TV switches asynchronously: look again shortly after.
    setTimeout(refresh, 150);
    setTimeout(refresh, 1200);
  }

  const dialog = $("channel-dialog");
  $("open-channels").addEventListener("click", () => {
    dialog.showModal();
    dialog.querySelector(".current")?.scrollIntoView({ block: "center" });
  });
  $("close-channels").addEventListener("click", () => dialog.close());
  // A tap on the dimmed background (outside the sheet) closes it.
  dialog.addEventListener("click", (event) => {
    if (event.target === dialog) dialog.close();
  });

  document.querySelectorAll("[data-action]").forEach((button) => {
    button.addEventListener("click", () => send({ action: button.dataset.action }));
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refresh();
  });
  setInterval(() => {
    if (document.visibilityState === "visible") refresh();
  }, 3000);
  setInterval(showProgress, 1000);
  refresh();
</script>
</body>
</html>
